# Перед merge цикл ждёт эти проверки. Фронтенд лежит в frontend/.
# В PR фронтенд обязан быть. В main до первой задачи его ещё нет — там шаги пропускаются.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request' || hashFiles('frontend/package.json') != ''
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        if: github.event_name == 'pull_request' || hashFiles('frontend/package.json') != ''
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
        if: github.event_name == 'pull_request' || hashFiles('frontend/package.json') != ''
      - run: npm run build
        if: github.event_name == 'pull_request' || hashFiles('frontend/package.json') != ''

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # agent-workers — приватный репозиторий: токен на чтение лежит в секрете AGENT_WORKERS_TOKEN.
      - run: git config --global url."https://x-access-token:${AGENT_WORKERS_TOKEN}@github.com/RusselSand/agent-workers".insteadOf "https://github.com/RusselSand/agent-workers"
        env:
          AGENT_WORKERS_TOKEN: ${{ secrets.AGENT_WORKERS_TOKEN }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
