  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

4)\">\n  <div sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:10px;padding:0 8px;cursor:pointer\">\n    <span style=\"position:relative;flex:none;width:26px;height:26px;border:5px solid #1d1d1d;border-radius:50%\"><span style=\"position:absolute;inset:3px;border-radius:50%;background:#1d1d1d\"><\u002Fspan><\u002Fspan>\n    <span style=\"font-size:22px;font-weight:800;letter-spacing:-0.02em\">council<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:4px\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;background:{{ navHomeBg }};color:{{ navHomeColor }}\">Сводка<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ goProjects }}\" style=\"padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;background:{{ navProjectsBg }};color:{{ navProjectsColor }}\">Проекты<\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ sidebarCouncils }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;flex-direction:column;gap:4px\">\n    <p style=\"margin:0;padding:0 16px 2px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Советы<\u002Fp>\n    <sc-for list=\"{{ sideGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;flex-direction:column;gap:2px;padding-top:8px\">\n        <span style=\"padding:0 16px 4px;font-size:12px;font-weight:700;color:#555\">{{ g.name }}<\u002Fspan>\n        <sc-for list=\"{{ g.items }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <div sc-camel-on-click=\"{{ c.open }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;background:{{ c.bg }};color:{{ c.color }}\">\n            <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:{{ c.dot }}\"><\u002Fspan>\n            <span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.title }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div sc-camel-on-click=\"{{ newCouncil }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:14px;font-weight:500;color:#555;cursor:pointer\" style-hover=\"color:#1d1d1d\">\n      <span style=\"flex:none;display:grid;place-items:center;width:18px;height:18px;border:1px dashed #888;border-radius:50%;font-size:12px;line-height:1\">+<\u002Fspan>Новый совет\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px;border-radius:18px;background:#f3f3f3\">\n    <p style=\"margin:0;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Модели совета<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ modelRows }}\" as=\"m\" hint-placeholder-count=\"3\">\n        <div style=\"display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;column-gap:9px\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:{{ m.dot }}\"><\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;min-width:0;line-height:1.25\">\n            <span style=\"font-size:12px;font-weight:700;color:{{ m.nameColor }}\">{{ m.name }}<\u002Fspan>\n            <span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8a8a8a;font-family:'JetBrains Mono',monospace;font-size:10px\">{{ m.provider }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;background:{{ m.stateBg }};color:{{ m.stateColor }}\">{{ m.state }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- Main -->\n<main style=\"display:flex;flex-direction:column;gap:18px;min-width:0;padding:6px\">\n  <header style=\"display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px\">\n    <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0\">\n      <sc-if value=\"{{ isCouncil }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#7a7a7a\">\n          <span sc-camel-on-click=\"{{ goHome }}\" style=\"cursor:pointer\" style-hover=\"color:#1d1d1d\">Сводка<\u002Fspan><span>/<\u002Fspan><span>{{ council.project }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <h1 style=\"margin:0;font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1.2\">{{ pageTitle }}<\u002Fh1>\n      <sc-if value=\"{{ isCouncil }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0;font-size:13px;color:#6a6a6a\">{{ council.meta }}<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 0;min-width:min-content;display:flex;flex-wrap:wrap;gap:8px;padding-top:8px\">\n      <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,0.6)\">\n          <sc-for list=\"{{ hvTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ t.pick }}\" style=\"padding:6px 14px;border:0;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:{{ t.bg }};color:{{ t.color }}\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:8px\">\n      <sc-if value=\"{{ isProjects }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ openNewProject }}\" style=\"padding:9px 19px;border:1px solid #1d1d1d;border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer\">+ Новый проект<\u002Fbutton>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ newCouncil }}\" style=\"padding:10px 20px;border:0;border-radius:999px;background:#1d1d1d;color:#fff;font-size:13px;font-weight:600;cursor:pointer\">+ Новый совет<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HOME -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n      <sc-for list=\"{{ projFilter }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ p.pick }}\" style=\"display:flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid {{ p.border }};border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:{{ p.bg }};color:{{ p.color }}\">{{ p.name }}<span style=\"font-size:11px;font-weight:700;opacity:.6\">{{ p.n }}<\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n      <div style=\"margin-left:auto;display:flex;gap:14px;font-size:12px;color:#6a6a6a\">\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#d1382f\"><\u002Fspan>ошибка<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#e0a100\"><\u002Fspan>ждёт вас<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#2f9e5b\"><\u002Fspan>ИИ работает / готово<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 1a kanban -->\n    <sc-if value=\"{{ hvKanban }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px\">\n        <sc-for list=\"{{ kanban }}\" as=\"col\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;min-height:460px;padding:12px 10px;border-radius:22px;background:rgba(255,255,255,0.5)\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:0 4px\">\n              <span style=\"display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1d1d1d;color:#fff;font-size:11px;font-weight:800\">{{ col.num }}<\u002Fspan>\n              <span style=\"flex:1;font-size:13px;font-weight:700\">{{ col.label }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#8a8a8a\">{{ col.count }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ col.launch }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ newCouncil }}\" style=\"padding:12px;border:1.5px dashed #c9c9c9;border-radius:16px;background:transparent;font-size:13px;font-weight:600;color:#555;cursor:pointer\" style-hover=\"border-color:#1d1d1d;color:#1d1d1d\">+ Новый совет<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ col.cards }}\" as=\"c\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n                <div sc-camel-on-click=\"{{ c.open }}\" style=\"display:flex;flex-direction:column;gap:2px;cursor:pointer\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a8a8a\">{{ c.project }}<\u002Fspan>\n                  <span style=\"font-size:14px;font-weight:700;line-height:1.25\">{{ c.title }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ c.rows }}\" as=\"r\" hint-placeholder-count=\"1\">\n                <div sc-camel-on-click=\"{{ r.open }}\" style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;cursor:pointer;background:{{ r.bg }}\" style-hover=\"filter:brightness(0.97)\">\n                  <span style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:{{ r.ink }}\"><span style=\"flex:none;width:7px;height:7px;border-radius:50%;background:{{ r.dot }}\"><\u002Fspan>{{ r.label }}<\u002Fspan>\n                  <span style=\"font-size:11px;line-height:1.35;color:{{ r.ink }}\">{{ r.need }}<\u002Fspan>\n                <\u002Fdiv>\n                <\u002Fsc-for>\n                <span style=\"font-size:10px;color:#9a9a9a\">{{ c.updated }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- 1b list -->\n    <sc-if value=\"{{ hvList }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px\">\n        <sc-for list=\"{{ listCards }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div sc-camel-on-click=\"{{ c.open }}\" style=\"display:flex;flex-direction:column;gap:3px;cursor:pointer\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"flex:1;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a8a8a\">{{ c.project }}<\u002Fspan>\n                <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:{{ c.tagBg }};color:{{ c.tagColor }}\">{{ c.lightText }}<\u002Fspan>\n              <\u002Fdiv>\n              <h3 style=\"margin:0;font-size:17px;font-weight:700;line-height:1.25\">{{ c.title }}<\u002Fh3>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:4px\">\n              <sc-for list=\"{{ c.track }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <div style=\"display:flex;flex-direction:column;gap:5px;min-width:0\">\n                  <span style=\"height:5px;border-radius:3px;background:{{ t.color }}\"><\u002Fspan>\n                  <span style=\"font-size:10px;color:{{ t.ink }};font-weight:{{ t.weight }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.label }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ c.rows }}\" as=\"r\" hint-placeholder-count=\"1\">\n                <div sc-camel-on-click=\"{{ r.open }}\" style=\"display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;cursor:pointer;background:{{ r.bg }}\" style-hover=\"filter:brightness(0.97)\">\n                  <span style=\"display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:{{ r.ink }}\"><span style=\"flex:none;width:7px;height:7px;border-radius:50%;background:{{ r.dot }}\"><\u002Fspan>{{ r.label }}<\u002Fspan>\n                  <span style=\"font-size:11px;line-height:1.35;color:{{ r.ink }}\">{{ r.need }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font-size:11px;color:#9a9a9a\">{{ c.updated }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- PROJECTS -->\n  <sc-if value=\"{{ isProjects }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"margin:0;max-width:640px;font-size:13px;line-height:1.5;color:#6a6a6a;text-wrap:pretty\">Репозитории и папка документации, которые совет берёт по проекту, а не вводит в каждом потоке. Проект выбирают на «Вводе» совета.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px\">\n      <sc-for list=\"{{ projectCards }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <h3 style=\"flex:1;margin:0;font-size:17px;font-weight:700\">{{ p.name }}<\u002Fh3>\n            <span style=\"font-size:12px;color:#7a7a7a\">{{ p.usage }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Репозитории<\u002Fspan>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <sc-for list=\"{{ p.repos }}\" as=\"r\" hint-placeholder-count=\"2\">\n                <span style=\"padding:4px 10px;border-radius:8px;background:#f1f1f1;font-family:'JetBrains Mono',monospace;font-size:12px\">{{ r }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Папка документации<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:{{ p.docsColor }}\">{{ p.docs }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:6px;margin-top:auto\">\n            <button sc-camel-on-click=\"{{ p.edit }}\" style=\"padding:7px 14px;border:1px solid #1d1d1d;border-radius:999px;background:transparent;font-size:12px;font-weight:600;cursor:pointer\">Править<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ p.remove }}\" style=\"padding:7px 10px;border:0;background:transparent;color:{{ p.removeColor }};font-size:12px;font-weight:600;cursor:pointer\">{{ p.removeLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- COUNCIL -->\n  <sc-if value=\"{{ isCouncil }}\" hint-placeholder-val=\"{{ false }}\">\n    <nav style=\"display:flex;flex-wrap:wrap;gap:4px;padding:4px;align-self:flex-start;border-radius:999px;background:rgba(255,255,255,0.6)\">\n      <sc-for list=\"{{ stageTabs }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ s.open }}\" style=\"display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border:0;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:{{ s.bg }};color:{{ s.color }}\">\n          <span style=\"display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:800;background:{{ s.numBg }};color:{{ s.numColor }};box-shadow:{{ s.numRing }}\">{{ s.num }}<\u002Fspan>{{ s.label }}\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <!-- BRIEF -->\n    <sc-if value=\"{{ stageBrief }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n        <div style=\"flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <h2 style=\"margin:0;font-size:18px;font-weight:700\">Мысли в свободной форме<\u002Fh2>\n            <p style=\"margin:0;font-size:13px;line-height:1.45;color:#6a6a6a;text-wrap:pretty\">Проблема, идея, вопросы, готовые решения — в любом порядке и вперемешку. Совет сам разберёт, что здесь что.<\u002Fp>\n          <\u002Fdiv>\n          <textarea value=\"{{ brief }}\" sc-camel-on-change=\"{{ setBrief }}\" placeholder=\"Что болит, что придумали, что уже решено…\" style=\"min-height:360px;padding:16px;border:0;border-radius:16px;background:#f1f1f1;font-size:14px;line-height:1.6;color:#1d1d1d;resize:vertical\"><\u002Ftextarea>\n          <div style=\"display:flex;align-items:center;gap:12px\">\n            <span style=\"font-size:12px;color:#8a8a8a\">{{ briefWords }}<\u002Fspan>\n            <span style=\"font-size:12px;color:#8a8a8a\">· сохранено<\u002Fspan>\n            <button sc-camel-on-click=\"{{ runSlice }}\" style=\"margin-left:auto;padding:10px 20px;border:0;border-radius:999px;background:#1d1d1d;color:#fff;font-size:13px;font-weight:600;cursor:pointer\">Нарезать →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 260px;max-width:100%;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Название<\u002Fspan>\n            <input value=\"{{ councilName }}\" sc-camel-on-change=\"{{ setName }}\" placeholder=\"Без названия\" style=\"padding:10px 14px;border:0;border-radius:14px;background:#f1f1f1;font-size:14px;color:#1d1d1d\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div style=\"display:flex;align-items:center\"><span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Проект<\u002Fspan><span sc-camel-on-click=\"{{ goProjects }}\" style=\"margin-left:auto;font-size:12px;font-weight:600;color:#555;cursor:pointer\">Проекты →<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <sc-for list=\"{{ projectChips }}\" as=\"p\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ p.pick }}\" style=\"padding:6px 14px;border:1px solid {{ p.border }};border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:{{ p.bg }};color:{{ p.color }}\">{{ p.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:12px;line-height:1.45;color:#7a7a7a;text-wrap:pretty\">{{ projectHint }}<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Совет<\u002Fspan>\n            <sc-for list=\"{{ participants }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <div style=\"display:flex;flex-direction:column;gap:1px;min-width:0;flex:1\">\n                  <span style=\"font-size:14px;font-weight:600\">{{ m.name }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:{{ m.subColor }}\">{{ m.sub }}<\u002Fspan>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ m.toggle }}\" style=\"display:flex;justify-content:{{ m.justify }};align-items:center;width:38px;height:22px;padding:3px;border:0;border-radius:999px;cursor:pointer;background:{{ m.track }};opacity:{{ m.opacity }}\"><span style=\"width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)\"><\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"height:1px;background:#e0e0e0\"><\u002Fdiv>\n            <span style=\"font-size:12px;font-weight:600;color:#555\">Судья<\u002Fspan>\n            <div style=\"display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:999px;background:#ececec;align-self:flex-start\">\n              <sc-for list=\"{{ judges }}\" as=\"j\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ j.pick }}\" style=\"padding:7px 14px;border:0;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:{{ j.bg }};color:{{ j.color }}\">{{ j.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- SLICES -->\n    <sc-if value=\"{{ stageSlices }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ slicesRunning }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n          <div style=\"flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <span style=\"align-self:flex-start;padding:4px 12px;border-radius:999px;background:#e3f3e9;color:#1f7a45;font-size:12px;font-weight:700\">ИИ работает<\u002Fspan>\n            <h2 style=\"margin:0;font-size:18px;font-weight:700\">Совет режет текст на фрагменты<\u002Fh2>\n            <p style=\"margin:0;font-size:13px;line-height:1.5;color:#6a6a6a\">Модели режут текст на смысловые фрагменты и размечают их. Это занимает минуты. Страницу можно закрыть: работа идёт на сервере.<\u002Fp>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <span style=\"height:44px;border-radius:14px;background:#f1f1f1\"><\u002Fspan>\n              <span style=\"height:44px;width:82%;border-radius:14px;background:#f3f3f3\"><\u002Fspan>\n              <span style=\"height:44px;width:64%;border-radius:14px;background:#f3f3f3\"><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 260px;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Ход работы<\u002Fspan>\n            <sc-for list=\"{{ progressRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex;align-items:center;gap:10px;font-size:13px\">\n                <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:{{ r.dot }}\"><\u002Fspan>\n                <span style=\"font-weight:600\">{{ r.step }}<\u002Fspan>\n                <span style=\"color:#8a8a8a;font-size:12px\">{{ r.who }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:12px;color:#6a6a6a\">{{ r.state }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"margin:0;font-size:12px;line-height:1.45;color:#7a7a7a\">Участники работают по отдельности, судья решает там, где они разошлись.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ slicesReady }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n          <div style=\"flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <h2 style=\"margin:0;font-size:18px;font-weight:700\">Фрагменты · {{ fragmentCount }}<\u002Fh2>\n              <p style=\"margin:0;font-size:13px;color:#6a6a6a\">Ваш текст без изменений: только разрезан и размечен. Не согласны с типом — выберите другой.<\u002Fp>\n            <\u002Fdiv>\n            <sc-for list=\"{{ fragments }}\" as=\"f\" hint-placeholder-count=\"6\">\n              <div style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:18px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a8a8a;padding-top:2px\">{{ f.id }}<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;gap:10px;min-width:0\">\n                  <p style=\"margin:0;font-size:14px;line-height:1.5;text-wrap:pretty\">{{ f.text }}<\u002Fp>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n                    <sc-for list=\"{{ f.labels }}\" as=\"l\" hint-placeholder-count=\"5\">\n                      <button sc-camel-on-click=\"{{ l.pick }}\" style=\"padding:4px 12px;border:1px solid {{ l.border }};border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:{{ l.bg }};color:{{ l.color }}\">{{ l.name }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                    <span style=\"font-size:11px;color:#8a8a8a\">{{ f.note }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 260px;position:sticky;top:22px;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:#1f1f1f;color:#fff\">\n            <span style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#a8a8a8\">Дальше<\u002Fspan>\n            <span style=\"font-size:16px;font-weight:700\">Разложить по группам<\u002Fspan>\n            <p style=\"margin:0;font-size:12px;line-height:1.5;color:#a8a8a8\">Совет сгруппирует фрагменты вокруг идей. Каждая группа станет потоком.<\u002Fp>\n            <button sc-camel-on-click=\"{{ toGroups }}\" style=\"align-self:flex-start;margin-top:4px;padding:9px 18px;border:0;border-radius:999px;background:#fff;color:#1d1d1d;font-size:13px;font-weight:600;cursor:pointer\">Предложить группы →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <!-- GROUPS -->\n    <sc-if value=\"{{ stageGroups }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ groupsFailed }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;background:#fbeceb\">\n          <span style=\"display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#d1382f;color:#fff;font-weight:800\">!<\u002Fspan>\n          <div style=\"flex:1;display:flex;flex-direction:column;gap:2px\">\n            <span style=\"font-size:14px;font-weight:700;color:#b8352d\">Раскладка остановилась<\u002Fspan>\n            <span style=\"font-size:12px;color:#b8352d\">fable не справилась: прерван, сервер остановился. Повтор не платит второй раз за готовые ответы.<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ retryGroups }}\" style=\"padding:9px 18px;border:0;border-radius:999px;background:#d1382f;color:#fff;font-size:13px;font-weight:600;cursor:pointer\">Запустить снова<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <h2 style=\"margin:0;font-size:18px;font-weight:700\">{{ groupsTitle }}<\u002Fh2>\n        <p style=\"margin:0;font-size:13px;color:#6a6a6a\">Только ваши фрагменты — ничего не добавлено. После подтверждения каждая группа станет потоком.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start\">\n        <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <span style=\"flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#1d1d1d;color:#fff;font-size:12px;font-weight:800\">{{ g.id }}<\u002Fspan>\n              <sc-if value=\"{{ g.renaming }}\" hint-placeholder-val=\"{{ false }}\">\n                <input value=\"{{ g.title }}\" sc-camel-on-change=\"{{ g.setTitle }}\" sc-camel-on-key-down=\"{{ g.titleKey }}\" sc-camel-on-blur=\"{{ g.closeMode }}\" sc-camel-auto-focus=\"{{ true }}\" style=\"flex:1;min-width:0;padding:6px 10px;border:1.5px solid #1d1d1d;border-radius:10px;background:#fff;font-family:inherit;font-size:16px;font-weight:700;color:#1d1d1d\">\n              <\u002Fsc-if>\n              <sc-if value=\"{{ g.notRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n                <h3 sc-camel-on-click=\"{{ g.rename }}\" style=\"flex:1;min-width:0;margin:0;font-size:16px;font-weight:700;line-height:1.25;cursor:text\">{{ g.title }}<\u002Fh3>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;background:#fbe7a6\">\n              <span style=\"display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7d5a00\">Идея<span style=\"padding:1px 8px;border-radius:999px;background:rgba(255,255,255,0.6);letter-spacing:0;text-transform:none;font-size:10px\">{{ g.ideaSrc }}<\u002Fspan><\u002Fspan>\n              <textarea value=\"{{ g.idea }}\" sc-camel-on-change=\"{{ g.setIdea }}\" rows=\"3\" placeholder=\"ИИ восстановит идею по фрагментам — или впишите свою\" style=\"padding:0;border:0;background:transparent;font-family:inherit;font-size:15px;font-weight:600;line-height:1.45;color:#1d1d1d;resize:vertical;outline:none\"><\u002Ftextarea>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <sc-for list=\"{{ g.frags }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <label style=\"display:flex;gap:8px;font-size:12px;line-height:1.45;color:#555;cursor:{{ g.fragCursor }}\">\n                  <sc-if value=\"{{ g.splitting }}\" hint-placeholder-val=\"{{ false }}\">\n                    <input type=\"checkbox\" checked=\"{{ f.sel }}\" sc-camel-on-change=\"{{ f.toggle }}\" style=\"flex:none;margin-top:2px;width:15px;height:15px;accent-color:#1d1d1d\">\n                  <\u002Fsc-if>\n                  <span style=\"flex:none;font-family:'JetBrains Mono',monospace;color:#8a8a8a\">{{ f.id }}<\u002Fspan>\n                  <span style=\"flex:1\">{{ f.text }}<\u002Fspan>\n                  <span style=\"flex:none;padding:1px 8px;height:fit-content;border-radius:999px;background:#ececec;font-size:10px;font-weight:600\">{{ f.label }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:11px;color:#8a8a8a\">{{ g.link }}<\u002Fp>\n            <sc-if value=\"{{ g.merging }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-radius:14px;background:#f1f1f1\">\n                <span style=\"font-size:12px;color:#555\">Объединить с<\u002Fspan>\n                <sc-for list=\"{{ g.targets }}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ t.pick }}\" style=\"padding:5px 12px;border:1px solid #1d1d1d;border-radius:999px;background:#fff;font-size:12px;font-weight:600;cursor:pointer\">{{ t.id }} · {{ t.title }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <button sc-camel-on-click=\"{{ g.closeMode }}\" style=\"margin-left:auto;padding:5px 8px;border:0;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer\">Отмена<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ g.splitting }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:#f1f1f1\">\n                <span style=\"flex:1;font-size:12px;color:#555\">{{ g.splitHint }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ g.closeMode }}\" style=\"padding:5px 8px;border:0;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer\">Отмена<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ g.doSplit }}\" style=\"padding:6px 14px;border:0;border-radius:999px;background:{{ g.splitBg }};color:#fff;font-size:12px;font-weight:600;cursor:pointer\">В новую группу<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ g.idle }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:2px;margin:0 -10px -6px\">\n                <button sc-camel-on-click=\"{{ g.merge }}\" style=\"padding:7px 10px;border:0;border-radius:999px;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer\" style-hover=\"color:#1d1d1d;background:#efefef\">Объединить с…<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ g.split }}\" style=\"padding:7px 10px;border:0;border-radius:999px;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer\" style-hover=\"color:#1d1d1d;background:#efefef\">Разделить<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ g.rename }}\" style=\"padding:7px 10px;border:0;border-radius:999px;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer\" style-hover=\"color:#1d1d1d;background:#efefef\">Переименовать<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;background:#1f1f1f;color:#fff\">\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:3px\">\n          <span style=\"font-size:15px;font-weight:700\">Подтвердить группы<\u002Fspan>\n          <span style=\"font-size:12px;color:#a8a8a8\">Дальше совет исследует код и макет под все группы сразу.<\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toResearch }}\" style=\"padding:10px 20px;border:0;border-radius:999px;background:#fff;color:#1d1d1d;font-size:13px;font-weight:600;cursor:pointer\">{{ confirmLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- RESEARCH -->\n    <sc-if value=\"{{ stageResearch }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"flex:1;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Код · необязательно<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:{{ rc.tagBg }};color:{{ rc.tagColor }}\">{{ rc.tag }}<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0;font-size:20px;font-weight:800;letter-spacing:-0.01em\">Исследование кода<\u002Fh2>\n          <p style=\"margin:0;max-width:720px;font-size:13px;line-height:1.5;color:#6a6a6a;text-wrap:pretty\">Совет один раз исследует код под все группы — карта реализации пойдёт в каждый поток.<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ rc.setup }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Репозитории проекта<\u002Fspan>\n            <sc-for list=\"{{ repoRows }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <label style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:#f1f1f1;cursor:pointer\">\n                <input type=\"checkbox\" checked=\"{{ r.on }}\" sc-camel-on-change=\"{{ r.toggle }}\" style=\"width:16px;height:16px;accent-color:#1d1d1d\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">{{ r.name }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:11px;color:#8a8a8a\">{{ r.meta }}<\u002Fspan>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:12px;line-height:1.45;color:#7a7a7a\">Сканируйте только свои, доверенные репозитории: модели читают код.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><button sc-camel-on-click=\"{{ rc.skip }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer\" style-hover=\"color:#1d1d1d;background:#efefef\">Пропустить<\u002Fbutton><button sc-camel-on-click=\"{{ rc.start }}\" style=\"margin-left:auto;padding:10px 20px;border:0;border-radius:999px;background:{{ rc.startBg }};color:#fff;font-size:13px;font-weight:600;cursor:{{ rc.startCursor }}\">Начать исследование<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rc.running }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#f3f3f3\">\n            <sc-for list=\"{{ rc.runs }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:10px;font-size:13px\">\n                <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#2f9e5b\"><\u002Fspan>\n                <span style=\"font-weight:600\">{{ r.who }}<\u002Fspan><span style=\"color:#8a8a8a;font-size:12px\">{{ r.what }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:12px;color:#6a6a6a\">работает…<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><span style=\"font-size:12px;color:#7a7a7a\">{{ rc.runNote }}<\u002Fspan><button sc-camel-on-click=\"{{ rc.stop }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer;margin-left:auto\" style-hover=\"color:#1d1d1d;background:#efefef\">Остановить<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rc.done }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#f3f3f3\">\n            <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#2f9e5b\"><\u002Fspan>\n            <span style=\"flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:12px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ rc.meta }}<\u002Fspan>\n            <span style=\"flex:none;font-size:12px;font-weight:600;color:#1d1d1d\">{{ rc.count }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><span style=\"font-size:12px;color:#7a7a7a\">{{ rc.doneNote }}<\u002Fspan><button sc-camel-on-click=\"{{ rc.reset }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer;margin-left:auto\" style-hover=\"color:#1d1d1d;background:#efefef\">Изменить и перезапустить<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rc.skipped }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px;border:1px dashed #c9c9c9;border-radius:16px;font-size:13px;line-height:1.45;color:#6a6a6a\">{{ rc.skipText }}<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><button sc-camel-on-click=\"{{ rc.reset }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer;margin-left:auto\" style-hover=\"color:#1d1d1d;background:#efefef\">Вернуть исследование<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"flex:1;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Макет · необязательно<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:{{ rd.tagBg }};color:{{ rd.tagColor }}\">{{ rd.tag }}<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"margin:0;font-size:20px;font-weight:800;letter-spacing:-0.01em\">Исследование макета<\u002Fh2>\n          <p style=\"margin:0;max-width:720px;font-size:13px;line-height:1.5;color:#6a6a6a;text-wrap:pretty\">Совет исследует макет Figma под все группы — экраны, данные, действия, состояния. Макет — намерение дизайнера, а не решение.<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ rd.setup }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <span style=\"font-size:12px;font-weight:600;color:#555\">Ссылка на Figma<\u002Fspan>\n            <input value=\"{{ figma }}\" sc-camel-on-change=\"{{ setFigma }}\" placeholder=\"https://www.figma.com/design/…?node-id=…\" style=\"padding:10px 14px;border:0;border-radius:14px;background:#f1f1f1;font-family:'JetBrains Mono',monospace;font-size:13px;color:#1d1d1d\">\n            <span style=\"font-size:12px;color:#7a7a7a\">Ссылки на страницы или фреймы одного файла: в Figma — Copy link to selection. Без node-id — весь файл.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><button sc-camel-on-click=\"{{ rd.skip }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer\" style-hover=\"color:#1d1d1d;background:#efefef\">Пропустить<\u002Fbutton><button sc-camel-on-click=\"{{ rd.start }}\" style=\"margin-left:auto;padding:10px 20px;border:0;border-radius:999px;background:{{ rd.startBg }};color:#fff;font-size:13px;font-weight:600;cursor:{{ rd.startCursor }}\">Начать исследование<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rd.running }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#f3f3f3\">\n            <sc-for list=\"{{ rd.runs }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;align-items:center;gap:10px;font-size:13px\">\n                <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#2f9e5b\"><\u002Fspan>\n                <span style=\"font-weight:600\">{{ r.who }}<\u002Fspan><span style=\"color:#8a8a8a;font-size:12px\">{{ r.what }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:12px;color:#6a6a6a\">работает…<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><span style=\"font-size:12px;color:#7a7a7a\">{{ rd.runNote }}<\u002Fspan><button sc-camel-on-click=\"{{ rd.stop }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer;margin-left:auto\" style-hover=\"color:#1d1d1d;background:#efefef\">Остановить<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rd.done }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#f3f3f3\">\n            <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#2f9e5b\"><\u002Fspan>\n            <span style=\"flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:12px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ rd.meta }}<\u002Fspan>\n            <span style=\"flex:none;font-size:12px;font-weight:600;color:#1d1d1d\">{{ rd.count }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><span style=\"font-size:12px;color:#7a7a7a\">{{ rd.doneNote }}<\u002Fspan><button sc-camel-on-click=\"{{ rd.reset }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer;margin-left:auto\" style-hover=\"color:#1d1d1d;background:#efefef\">Изменить и перезапустить<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rd.skipped }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:14px;border:1px dashed #c9c9c9;border-radius:16px;font-size:13px;line-height:1.45;color:#6a6a6a\">{{ rd.skipText }}<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:14px;border-top:1px solid #e0e0e0\"><button sc-camel-on-click=\"{{ rd.reset }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer;margin-left:auto\" style-hover=\"color:#1d1d1d;background:#efefef\">Вернуть исследование<\u002Fbutton><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasFindings }}\" hint-placeholder-val=\"{{ false }}\">\n        <section style=\"display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Результаты<\u002Fspan>\n            <h2 style=\"margin:0;font-size:20px;font-weight:800;letter-spacing:-0.01em\">Что пойдёт в потоки<\u002Fh2>\n            <p style=\"margin:0;max-width:720px;font-size:13px;line-height:1.5;color:#6a6a6a;text-wrap:pretty\">Факты уходят как есть. Выводы ИИ подтвердите или отклоните. В противоречиях выберите, кто прав, или отправьте вопросом. Пробелы по умолчанию станут вопросами потока.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n            <sc-for list=\"{{ findFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ f.pick }}\" style=\"display:flex;align-items:center;gap:7px;padding:6px 13px;border:1px solid {{ f.border }};border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:{{ f.bg }};color:{{ f.color }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ f.dot }}\"><\u002Fspan>{{ f.label }}<span style=\"font-size:11px;font-weight:700;opacity:.6\">{{ f.n }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ findGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding-top:6px\">\n                <span style=\"display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#1d1d1d;color:#fff;font-size:11px;font-weight:800\">{{ g.id }}<\u002Fspan>\n                <span style=\"flex:1;font-size:15px;font-weight:700\">{{ g.title }}<\u002Fspan>\n                <span style=\"font-size:12px;color:#8a8a8a\">{{ g.count }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:{{ f.bg }};box-shadow:{{ f.ring }}\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                    <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:{{ f.tagBg }};color:{{ f.tagColor }}\">{{ f.typeLabel }}<\u002Fspan>\n                    <span style=\"font-size:11px;font-weight:600;color:#8a8a8a\">{{ f.src }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font-size:11px;font-weight:700;color:{{ f.outColor }}\">{{ f.outcome }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-size:14px;line-height:1.45;text-wrap:pretty\">{{ f.text }}<\u002Fspan>\n                  <sc-if value=\"{{ f.isConflict }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px\">\n                      <div style=\"display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;background:#fff;border:1.5px solid {{ f.textBorder }}\">\n                        <span style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">{{ f.leftLabel }}<\u002Fspan>\n                        <span style=\"font-size:13px;line-height:1.4\">{{ f.textSide }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;background:#fff;border:1.5px solid {{ f.otherBorder }}\">\n                        <span style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">{{ f.otherLabel }}<\u002Fspan>\n                        <span style=\"font-size:13px;line-height:1.4\">{{ f.otherSide }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n                    <span style=\"flex:1 1 200px;min-width:0;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a8a8a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ f.ref }}<\u002Fspan>\n                    <sc-for list=\"{{ f.actions }}\" as=\"b\" hint-placeholder-count=\"2\">\n                      <button sc-camel-on-click=\"{{ b.run }}\" style=\"padding:6px 13px;border:1px solid {{ b.border }};border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:{{ b.bg }};color:{{ b.color }}\">{{ b.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasFlows }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px;align-items:start\">\n          <section style=\"display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Потоки в коде · {{ flowCount }}<\u002Fspan>\n              <p style=\"margin:0;font-size:13px;line-height:1.5;color:#6a6a6a\">Как сейчас проходит запрос: от точки входа по шагам, со ссылками на находки.<\u002Fp>\n            <\u002Fdiv>\n            <sc-for list=\"{{ flows }}\" as=\"fl\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:#f3f3f3\">\n                <div sc-camel-on-click=\"{{ fl.toggle }}\" style=\"display:flex;align-items:baseline;gap:8px;cursor:pointer\">\n                  <span style=\"flex:1;font-size:14px;font-weight:700;line-height:1.35\">{{ fl.name }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#6a6a6a\">{{ fl.toggleLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a8a8a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ fl.entry }}<\u002Fspan>\n                <sc-if value=\"{{ fl.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <ol style=\"display:flex;flex-direction:column;gap:8px;margin:4px 0 0;padding:0;list-style:none\">\n                    <sc-for list=\"{{ fl.steps }}\" as=\"st\" hint-placeholder-count=\"3\">\n                      <li style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:13px;line-height:1.45\">\n                        <span style=\"display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;font-size:11px;font-weight:700\">{{ st.n }}<\u002Fspan>\n                        <span>{{ st.text }} <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a8a8a\">{{ st.refs }}<\u002Fspan><\u002Fspan>\n                      <\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Fol>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n          <section style=\"display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Покрытие · {{ coverageSummary }}<\u002Fspan>\n              <p style=\"margin:0;font-size:13px;line-height:1.5;color:#6a6a6a\">Какие части кода совет проверил. Частично проверенное — повод для вопроса в потоке.<\u002Fp>\n            <\u002Fdiv>\n            <sc-for list=\"{{ coverage }}\" as=\"cv\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline\">\n                <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:{{ cv.bg }};color:{{ cv.color }}\">{{ cv.label }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:600;line-height:1.35\">{{ cv.area }}<\u002Fspan>\n                <span><\u002Fspan>\n                <span style=\"font-size:12px;line-height:1.45;color:#6a6a6a\">{{ cv.reason }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;background:#1f1f1f;color:#fff\">\n        <div style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:3px\">\n          <span style=\"font-size:15px;font-weight:700\">Утвердить исследование<\u002Fspan>\n          <span style=\"font-size:12px;color:#a8a8a8\">{{ researchNote }}<\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toStreamsGuard }}\" style=\"padding:10px 20px;border:0;border-radius:999px;background:{{ researchBtnBg }};color:{{ researchBtnColor }};font-size:13px;font-weight:600;cursor:{{ researchBtnCursor }}\">К потокам →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- STREAMS -->\n    <sc-if value=\"{{ stageStreams }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n        <sc-for list=\"{{ streamTabs }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ s.open }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 16px 10px 10px;border:0;border-radius:18px;cursor:pointer;text-align:left;background:{{ s.bg }};color:{{ s.color }};box-shadow:{{ s.shadow }}\">\n            <span style=\"display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:800;background:{{ s.badgeBg }};color:{{ s.badgeColor }}\">{{ s.id }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:1px\">\n              <span style=\"font-size:13px;font-weight:700\">{{ s.title }}<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:6px;font-size:11px;color:{{ s.subColor }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ s.dot }}\"><\u002Fspan>{{ s.status }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start\">\n        <!-- chain -->\n        <div style=\"flex:1 1 260px;max-width:340px;position:sticky;top:22px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px 14px 10px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n          <div style=\"display:flex;align-items:baseline;gap:8px;padding:0 4px\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Цепочка<\u002Fspan>\n            <span style=\"font-size:12px;color:#7a7a7a\">поток {{ stream.id }}<\u002Fspan>\n          <\u002Fdiv>\n          <ol style=\"display:flex;flex-direction:column;margin:0;padding:0;list-style:none\">\n            <sc-for list=\"{{ chain }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <li style=\"display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px\">\n                <div style=\"display:flex;flex-direction:column;align-items:center\">\n                  <span style=\"flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid {{ c.numBorder }};background:{{ c.numBg }};color:{{ c.numColor }};font-size:12px;font-weight:700\">{{ c.num }}<\u002Fspan>\n                  <span style=\"flex:1;width:2px;min-height:10px;background:{{ c.line }}\"><\u002Fspan>\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ c.open }}\" style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:6px;padding:5px 10px 8px;border-radius:14px;cursor:{{ c.cursor }};background:{{ c.bg }};opacity:{{ c.opacity }}\" style-hover=\"background:#efefef\">\n                  <span style=\"display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600\">{{ c.title }}<span style=\"font-size:10px;font-weight:600;color:#8a8a8a\">{{ c.optional }}<\u002Fspan><\u002Fspan>\n                  <span style=\"font-size:12px;color:{{ c.noteColor }}\">{{ c.note }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fdiv>\n        <sc-if value=\"{{ banner.show }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:22px;background:{{ banner.bg }}\">\n            <span style=\"display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:{{ banner.color }}\"><span style=\"width:9px;height:9px;border-radius:50%;background:{{ banner.dot }}\"><\u002Fspan>{{ banner.title }}<\u002Fspan>\n            <span style=\"font-size:12px;line-height:1.5;color:{{ banner.color }}\">{{ banner.text }}<\u002Fspan>\n            <sc-i
