f value=\"{{ banner.retry }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ retryStep }}\" style=\"align-self:flex-start;padding:7px 14px;border:0;border-radius:999px;background:#d1382f;color:#fff;font-size:12px;font-weight:600;cursor:pointer\">Запустить снова<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ showRunPanel }}\" hint-placeholder-val=\"{{ false }}\">\n          <!-- 2a grouped -->\n          <sc-if value=\"{{ runGrouped }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:22px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div style=\"display:flex;align-items:baseline;gap:8px\">\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Ход работы<\u002Fspan>\n              <span style=\"font-size:11px;color:#9a9a9a\">последний запуск<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ runGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <div style=\"display:flex;align-items:baseline;gap:8px\">\n                  <span style=\"font-size:13px;font-weight:700\">{{ g.step }}<\u002Fspan>\n                  <span style=\"margin-left:auto;font-size:11px;color:{{ g.stateColor }}\">{{ g.state }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ g.models }}\" as=\"m\" hint-placeholder-count=\"2\">\n                    <span style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:600;background:{{ m.bg }};color:{{ m.color }};border:1px {{ m.borderStyle }} {{ m.border }}\">{{ m.dotEl }}{{ m.who }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <!-- 2b grid -->\n          <sc-if value=\"{{ runGrid }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:22px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div style=\"display:flex;align-items:baseline;gap:8px\">\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Ход работы<\u002Fspan>\n              <span style=\"font-size:11px;color:#9a9a9a\">последний запуск<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) repeat({{ runCols }},34px);align-items:center;row-gap:8px;column-gap:4px\">\n              <span><\u002Fspan>\n              <sc-for list=\"{{ runModels }}\" as=\"m\" hint-placeholder-count=\"2\">\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;color:#8a8a8a;text-align:center\">{{ m }}<\u002Fspan>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ runCells }}\" as=\"c\" hint-placeholder-count=\"6\">\n                <span style=\"justify-self:{{ c.justify }};display:{{ c.display }};font-size:13px;font-weight:600;line-height:1.3;width:{{ c.w }};height:{{ c.h }};border-radius:50%;background:{{ c.dot }};box-shadow:{{ c.ring }}\">{{ c.text }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#8a8a8a\">\n              <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:8px;height:8px;border-radius:50%;background:#2f9e5b\"><\u002Fspan>готово<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:8px;height:8px;border-radius:50%;background:#d1382f\"><\u002Fspan>сбой<\u002Fspan>\n              <span style=\"display:flex;align-items:center;gap:5px\"><span style=\"width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #c9c9c9\"><\u002Fspan>не понадобился<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <!-- 2c summary -->\n          <sc-if value=\"{{ runSummary }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ toggleRuns }}\" style=\"display:flex;flex-direction:column;gap:10px;padding:14px 18px;border-radius:22px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);cursor:pointer\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:{{ runDot }}\"><\u002Fspan>\n                <div style=\"flex:1;display:flex;flex-direction:column;gap:1px;min-width:0\">\n                  <span style=\"font-size:13px;font-weight:700\">{{ runHead }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#8a8a8a\">{{ runSub }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:12px;color:#6a6a6a\">{{ runArrow }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ runsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #ececec\">\n                  <sc-for list=\"{{ runFlat }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:12px\">\n                      <span style=\"font-weight:600\">{{ r.step }} · <span style=\"font-family:'JetBrains Mono',monospace;font-weight:400;color:#8a8a8a\">{{ r.who }}<\u002Fspan><\u002Fspan>\n                      <span style=\"color:{{ r.color }}\">{{ r.state }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n        <\u002Fdiv>\n        <!-- step -->\n        <div style=\"flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">{{ stepHead.caps }}<\u002Fspan>\n              <h2 style=\"margin:0;font-size:20px;font-weight:800;letter-spacing:-0.01em\">{{ stepHead.title }}<\u002Fh2>\n              <p style=\"margin:0;max-width:720px;font-size:13px;line-height:1.5;color:#6a6a6a;text-wrap:pretty\">{{ stepHead.hint }}<\u002Fp>\n            <\u002Fdiv>\n\n            <!-- project decisions -->\n            <sc-if value=\"{{ is.project }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:#fbe7a6\">\n                <span style=\"font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7d5a00\">Идея потока · утверждена в группах<\u002Fspan>\n                <span style=\"font-size:14px;font-weight:600;line-height:1.45\">{{ stream.idea }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ pd.summary }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:#f3f3f3\">\n                  <span style=\"flex:1;font-size:14px\">{{ pd.taken }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ pd.edit }}\" style=\"padding:7px 14px;border:1px solid #1d1d1d;border-radius:999px;background:transparent;font-size:12px;font-weight:600;cursor:pointer\">Изменить отбор<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ pd.editing }}\" hint-placeholder-val=\"{{ true }}\">\n                <sc-if value=\"{{ pd.hasUnexported }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin:0;font-size:12px;color:#7d5a00\">{{ pd.unexported }}<\u002Fp>\n                <\u002Fsc-if>\n                <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#555\">{{ pd.catalog }}<\u002Fspan>\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ pd.items }}\" as=\"d\" hint-placeholder-count=\"4\">\n                    <label style=\"display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;padding:14px 16px;border-radius:16px;cursor:pointer;background:{{ d.bg }};box-shadow:{{ d.ring }}\">\n                      <input type=\"checkbox\" checked=\"{{ d.on }}\" sc-camel-on-change=\"{{ d.toggle }}\" style=\"margin-top:2px;width:16px;height:16px;accent-color:#1d1d1d\">\n                      <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600\">{{ d.adr }}<\u002Fspan>\n                          <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:{{ d.relBg }};color:{{ d.relColor }}\">{{ d.rel }}<\u002Fspan>\n                          <sc-if value=\"{{ d.hasStatus }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#ececec;color:#555\">{{ d.status }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <span style=\"font-size:14px;font-weight:600;line-height:1.4\">{{ d.decision }}<\u002Fspan>\n                        <span style=\"font-size:12px;color:#6a6a6a\">вопрос: {{ d.question }}<\u002Fspan>\n                        <span style=\"font-size:12px;line-height:1.45;color:#555\">{{ d.reason }}<\u002Fspan>\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a8a8a\">{{ d.trail }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:14px;border-top:1px solid #e0e0e0\">\n                  <button sc-camel-on-click=\"{{ pd.skip }}\" style=\"padding:10px 14px;border:0;border-radius:999px;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer\" style-hover=\"color:#1d1d1d;background:#efefef\">Без прошлых решений → к вопросам<\u002Fbutton>\n                  <span style=\"margin-left:auto;font-size:12px;color:#7a7a7a\">{{ pd.count }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ pd.approve }}\" style=\"padding:10px 20px;border:0;border-radius:999px;background:#1d1d1d;color:#fff;font-size:13px;font-weight:600;cursor:pointer\">Учитывать отмеченные → к вопросам<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n\n            <!-- questions -->\n            <sc-if value=\"{{ is.questions }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ questionRows }}\" as=\"q\" hint-placeholder-count=\"4\">\n                  <div style=\"display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 14px;border-radius:16px;background:{{ q.bg }};opacity:{{ q.opacity }}\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a8a8a;padding-top:2px\">{{ q.id }}<\u002Fspan>\n                    <div style=\"display:flex;flex-direction:column;gap:4px;min-width:0\">\n                      <span style=\"font-size:14px;line-height:1.45;text-decoration:{{ q.strike }}\">{{ q.text }}<\u002Fspan>\n                      <span style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11px;color:#8a8a8a\"><span style=\"padding:1px 8px;border-radius:999px;background:#ececec;color:#555;font-weight:600\">{{ q.src }}<\u002Fspan>{{ q.why }}<\u002Fspan>\n                      <sc-if value=\"{{ q.hasRevisits }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:4px;padding:10px 12px;border-radius:12px;background:#fbeceb\">\n                          <span style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#b8352d\">Пересматривает решение проекта<span style=\"padding:1px 8px;border-radius:6px;background:#fff;font-family:'JetBrains Mono',monospace;font-weight:600\">{{ q.revisits }}<\u002Fspan><\u002Fspan>\n                          <span style=\"font-size:13px;line-height:1.4;color:#1d1d1d;text-decoration:line-through;text-decoration-color:rgba(184,53,45,.45)\">{{ q.revisitsText }}<\u002Fspan>\n                          <span style=\"font-size:11px;line-height:1.45;color:#8a3b35\">Пока вопрос открыт, {{ q.revisits }} — under_review: другие потоки на него не опираются. Когда вопрос решат, новый ADR заменит его — {{ q.revisits }} станет superseded.<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ q.hasProps }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:4px;padding:10px 12px;border-radius:12px;background:#e3f3e9\">\n                          <span style=\"font-size:11px;font-weight:700;color:#1f7a45\">{{ q.propsLabel }}<\u002Fspan>\n                          <sc-for list=\"{{ q.props }}\" as=\"p\" hint-placeholder-count=\"1\">\n                            <div style=\"display:flex;gap:8px;font-size:13px;line-height:1.4\">\n                              <span style=\"flex:none;font-family:'JetBrains Mono',monospace;font-size:12px;color:#1f7a45\">{{ p.id }}<\u002Fspan>\n                              <span style=\"flex:1;color:#1d1d1d\">«{{ p.text }}»<\u002Fspan>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                          <span style=\"font-size:11px;color:#4a7a5c\">Станет вариантом «из группы» на следующем шаге — вопрос можно оставить, чтобы сравнить с другими.<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ q.toggle }}\" style=\"padding:6px 10px;border:0;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer\" style-hover=\"color:#1d1d1d\">{{ q.action }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <input value=\"{{ newQ }}\" sc-camel-on-change=\"{{ setNewQ }}\" placeholder=\"Свой вопрос…\" style=\"flex:1;padding:10px 14px;border:0;border-radius:14px;background:#f1f1f1;font-size:14px;color:#1d1d1d\">\n                <button sc-camel-on-click=\"{{ addQ }}\" style=\"padding:9px 18px;border:1px solid #1d1d1d;border-radius:999px;background:transparent;font-size:13px;font-weight:600;cursor:pointer\">Добавить<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- options -->\n            <sc-if value=\"{{ is.options }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n                <sc-for list=\"{{ optChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ c.open }}\" style=\"display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid {{ c.border }};border-radius:999px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:#1d1d1d\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ c.dot }}\"><\u002Fspan>{{ c.id }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <span style=\"margin-left:auto;font-size:12px;color:#7a7a7a\">{{ optCount }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ optPrev }}\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#efefef;cursor:pointer;font-size:14px\">←<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ optNext }}\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#efefef;cursor:pointer;font-size:14px\">→<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                <span style=\"flex:none;padding-top:3px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a8a8a\">{{ optQ.id }}<\u002Fspan>\n                <span style=\"flex:none;margin-top:2px;padding:2px 8px;border-radius:6px;background:#1d1d1d;color:#fff;font-size:11px;font-weight:700\">{{ optQ.src }}<\u002Fspan>\n                <span style=\"font-size:17px;font-weight:700;line-height:1.35;text-wrap:pretty\">{{ optQ.text }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:#f3f3f3\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Выбор за вами<\u002Fspan>\n                  <span style=\"font-size:11px;color:#9a9a9a\">судья fable<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0;font-size:13px;line-height:1.55;color:#1d1d1d;text-wrap:pretty\">{{ judge.summary }}<\u002Fp>\n                <span sc-camel-on-click=\"{{ toggleDropped }}\" style=\"align-self:flex-start;font-size:12px;font-weight:600;color:#555;cursor:pointer\" style-hover=\"color:#1d1d1d\">{{ judge.droppedLabel }}<\u002Fspan>\n                <sc-if value=\"{{ judge.open }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-for list=\"{{ judge.dropped }}\" as=\"d\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:#fbfbfb\">\n                      <span style=\"font-size:13px;font-weight:600;color:#6a6a6a;text-decoration:line-through\">{{ d.text }}<\u002Fspan>\n                      <span style=\"font-size:12px;line-height:1.45;color:#7a7a7a\">{{ d.why }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ optList }}\" as=\"o\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;flex-direction:column;gap:10px;padding:16px 18px;border:1.5px solid {{ o.border }};border-radius:18px;background:{{ o.bg }}\">\n                    <div sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:flex-start;gap:12px;cursor:pointer\">\n                      <span style=\"flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid {{ o.radioBorder }};background:#fff\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ o.radioDot }}\"><\u002Fspan><\u002Fspan>\n                      <div style=\"flex:1;display:flex;flex-direction:column;gap:8px;min-width:0\">\n                        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a8a8a\">{{ o.pid }}<\u002Fspan>\n                          <span style=\"padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:{{ o.srcBg }};color:{{ o.srcColor }}\">{{ o.src }}<\u002Fspan>\n                          <sc-if value=\"{{ o.rec }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#e3f3e9;color:#1f7a45\">рекомендация судьи<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <sc-if value=\"{{ o.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                          <span style=\"font-size:15px;font-weight:700;line-height:1.4;text-wrap:pretty\">{{ o.text }}<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ o.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;flex-direction:column;gap:8px;padding-left:32px\">\n                        <textarea value=\"{{ o.text }}\" sc-camel-on-change=\"{{ o.setText }}\" rows=\"2\" style=\"padding:10px 12px;border:1.5px solid #1d1d1d;border-radius:12px;background:#fff;font-family:inherit;font-size:14px;font-weight:600;line-height:1.4;color:#1d1d1d;resize:vertical\"><\u002Ftextarea>\n                        <span style=\"font-size:12px;color:#7a7a7a\">Правка станет вашим вариантом — совет пересмотрит «почему» и «цену» под новую формулировку.<\u002Fspan>\n                        <div style=\"display:flex;gap:6px\">\n                          <button sc-camel-on-click=\"{{ o.saveEdit }}\" style=\"padding:7px 14px;border:0;border-radius:999px;background:#1d1d1d;color:#fff;font-size:12px;font-weight:600;cursor:pointer\">Сохранить<\u002Fbutton>\n                          <button sc-camel-on-click=\"{{ o.cancelEdit }}\" style=\"padding:7px 10px;border:0;background:transparent;color:#555;font-size:12px;font-weight:600;cursor:pointer\">Отмена<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;padding-left:32px;font-size:13px;line-height:1.5\">\n                      <span style=\"font-size:12px;color:#8a8a8a\">почему<\u002Fspan><span style=\"color:#3a3a3a;text-wrap:pretty\">{{ o.why }}<\u002Fspan>\n                      <sc-if value=\"{{ o.hasCost }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:12px;color:#8a8a8a\">цена<\u002Fspan><span style=\"color:#3a3a3a;text-wrap:pretty\">{{ o.cost }}<\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-left:32px\">\n                      <sc-for list=\"{{ o.deps }}\" as=\"d\" hint-placeholder-count=\"1\">\n                        <button sc-camel-on-click=\"{{ d.open }}\" style=\"display:flex;align-items:center;gap:6px;padding:4px 10px;border:0;border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;background:{{ d.bg }};color:{{ d.color }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ d.dot }}\"><\u002Fspan>зависит от {{ d.id }} · {{ d.state }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                      <sc-if value=\"{{ o.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                        <button sc-camel-on-click=\"{{ o.edit }}\" style=\"margin-left:auto;padding:4px 8px;border:0;background:transparent;color:#555;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer\" style-hover=\"color:#1d1d1d\">Поправить<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 18px;border:1.5px solid {{ own.border }};border-radius:18px;background:{{ own.bg }}\">\n                  <div sc-camel-on-click=\"{{ own.pick }}\" style=\"display:flex;align-items:center;gap:12px;cursor:pointer\">\n                    <span style=\"flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid {{ own.radioBorder }};background:#fff\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ own.radioDot }}\"><\u002Fspan><\u002Fspan>\n                    <span style=\"padding:2px 8px;border-radius:6px;background:#ececec;color:#555;font-size:11px;font-weight:700\">вы<\u002Fspan>\n                    <span style=\"font-size:14px;font-weight:600\">Свой вариант<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ own.on }}\" hint-placeholder-val=\"{{ false }}\">\n                    <textarea value=\"{{ own.text }}\" sc-camel-on-change=\"{{ own.setText }}\" rows=\"2\" placeholder=\"Опишите, как должно работать. Совет допишет «почему», «цену» и зависимости.\" style=\"margin-left:32px;padding:10px 12px;border:0;border-radius:12px;background:#f1f1f1;font-family:inherit;font-size:14px;line-height:1.4;color:#1d1d1d;resize:vertical\"><\u002Ftextarea>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ pickUnresolved }}\" style=\"display:flex;align-items:center;gap:12px;padding:14px 18px;border:1.5px dashed {{ unresolvedBorder }};border-radius:18px;cursor:pointer;font-size:14px;color:#555\">\n                  <span style=\"flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1.5px solid {{ unres.radioBorder }};background:#fff\"><span style=\"width:10px;height:10px;border-radius:50%;background:{{ unres.radioDot }}\"><\u002Fspan><\u002Fspan>Пока не решаю — передать как unresolved\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- decisions -->\n            <sc-if value=\"{{ is.decisions }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n                <sc-for list=\"{{ decChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on-click=\"{{ c.open }}\" style=\"display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid {{ c.border }};border-radius:999px;background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:#1d1d1d\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ c.dot }}\"><\u002Fspan>{{ c.id }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <span style=\"margin-left:auto;font-size:12px;color:#7a7a7a\">{{ decCount }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ decPrev }}\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#efefef;cursor:pointer;font-size:14px\">←<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ decNext }}\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#efefef;cursor:pointer;font-size:14px\">→<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                <span style=\"flex:none;padding-top:3px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a8a8a\">{{ dc.id }}<\u002Fspan>\n                <span style=\"flex:1;font-size:17px;font-weight:700;line-height:1.35;text-wrap:pretty\">{{ dc.q }}<\u002Fspan>\n                <span style=\"flex:none;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:{{ dc.tagBg }};color:{{ dc.tagColor }}\">{{ dc.tag }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:13px;line-height:1.5;color:#555\">Ваш выбор: <span style=\"font-weight:700;color:#1d1d1d\">{{ dc.pid }} · {{ dc.choice }}<\u002Fspan><\u002Fp>\n              <sc-if value=\"{{ dc.hasProblem }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:16px;background:#fbeceb\">\n                  <p style=\"margin:0;font-size:13px;line-height:1.55;color:#7a2620;text-wrap:pretty\"><span style=\"font-weight:700;color:#b8352d\">Проблема: <\u002Fspan>{{ dc.problem }}<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <span style=\"font-size:12px;font-weight:700;color:#b8352d\">Что поправить<\u002Fspan>\n                    <sc-for list=\"{{ dc.fixes }}\" as=\"f\" hint-placeholder-count=\"1\">\n                      <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.55;color:#7a2620\">\n                        <span style=\"display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;font-size:11px;font-weight:800;color:#b8352d\">{{ f.n }}<\u002Fspan>\n                        <span style=\"text-wrap:pretty\"><span style=\"font-weight:700\">{{ f.q }}<\u002Fspan> — {{ f.text }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;padding-top:10px;border-top:1px solid rgba(184,53,45,.15);font-size:12px;line-height:1.5;color:#8a3b35\">Поправить текст варианта — на шаге «Варианты»: выберите свой вариант с поправленным текстом, совет проверит его заново. Оставить как есть — объясните это в «почему».<\u002Fp>\n                  <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                    <button sc-camel-on-click=\"{{ dc.toOptions }}\" style=\"padding:7px 14px;border:0;border-radius:999px;background:#d1382f;color:#fff;font-size:12px;font-weight:600;cursor:pointer\">Поправить в «Вариантах»<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ dc.recheck }}\" style=\"padding:7px 14px;border:1px solid #d1382f;border-radius:999px;background:transparent;color:#b8352d;font-size:12px;font-weight:600;cursor:pointer\">{{ dc.recheckLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ dc.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                <p style=\"margin:0;padding:12px 14px;border-radius:14px;background:#f3f3f3;font-size:13px;line-height:1.55;color:#555;text-wrap:pretty\"><span style=\"font-weight:700;color:#1d1d1d\">Судья: <\u002Fspan>{{ dc.note }}<\u002Fp>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 18px;border:1px solid #e6e6e6;border-radius:18px;background:#fff\">\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700\">{{ dc.adr }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#8a8a8a\">· {{ dc.adrState }}<\u002Fspan>\n                  <span style=\"margin-left:auto;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:{{ dc.verdictBg }};color:{{ dc.verdictColor }}\">{{ dc.verdict }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px 14px;font-size:13px;line-height:1.5\">\n                  <span style=\"font-size:12px;color:#8a8a8a\">контекст<\u002Fspan><span>{{ dc.q }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#8a8a8a\">решение<\u002Fspan><span style=\"font-weight:600\">{{ dc.pid }} · {{ dc.choice }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#8a8a8a\">почему<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:6px\">\n                    <textarea value=\"{{ dc.why }}\" sc-camel-on-change=\"{{ dc.setWhy }}\" rows=\"3\" placeholder=\"Почему этот вариант — своими словами или поправьте текст ИИ\" style=\"padding:10px 12px;border:1px solid #e0e0e0;border-radius:12px;background:#fbfbfb;font-family:inherit;font-size:13px;line-height:1.5;color:#1d1d1d;resize:vertical\"><\u002Ftextarea>\n                    <span style=\"align-self:flex-start;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:{{ dc.byBg }};color:{{ dc.byColor }}\">{{ dc.by }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ dc.hasDeps }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size:12px;color:#8a8a8a\">в контексте<\u002Fspan>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{ dc.deps }}\" as=\"x\" hint-placeholder-count=\"1\"><span style=\"padding:2px 9px;border-radius:999px;background:#f1f1f1;font-family:'JetBrains Mono',monospace;font-size:11px\">{{ x.label }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <span style=\"font-size:12px;color:#8a8a8a\">последствия<\u002Fspan>\n                  <div style=\"display:flex;flex-direction:column;gap:2px\"><sc-for list=\"{{ dc.checks }}\" as=\"k\" hint-placeholder-count=\"1\"><span style=\"color:{{ k.color }}\">{{ k.text }}<\u002Fspan><\u002Fsc-for><\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ dc.noWhy }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:12px;color:#7d5a00\">Без обоснования решение не зафиксировать.<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                <span style=\"font-size:13px;color:#555\">Решение:<\u002Fspan>\n                <sc-for list=\"{{ dc.picks }}\" as=\"p\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ p.pick }}\" style=\"padding:6px 13px;border:1px solid {{ p.border }};border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;background:{{ p.bg }};color:{{ p.color }}\">{{ p.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <button sc-camel-on-click=\"{{ dc.keepOpen }}\" style=\"padding:6px 13px;border:1px solid {{ dc.openBorder }};border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;background:{{ dc.openBg }};color:{{ dc.openColor }}\">Оставить открытым<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ dc.accept }}\" style=\"margin-left:auto;padding:9px 18px;border:0;border-radius:999px;background:{{ dc.acceptBg }};color:#fff;font-size:13px;font-weight:600;cursor:{{ dc.acceptCursor }}\">{{ dc.acceptLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <!-- outcomes -->\n            <sc-if value=\"{{ is.outcomes }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:6px\">\n                <sc-for list=\"{{ outChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ c.open }}\" style=\"display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid {{ c.border }};border-radius:999px;background:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer;color:#1d1d1d\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ c.dot }}\"><\u002Fspan>{{ c.id }}<\u002Fbutton>\n                <\u002Fsc-for>\n                <span style=\"margin-left:auto;font-size:12px;color:#7a7a7a\">{{ outCount }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ outPrev }}\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#efefef;cursor:pointer;font-size:14px\">←<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ outNext }}\" style=\"width:30px;height:30px;border:0;border-radius:50%;background:#efefef;cursor:pointer;font-size:14px\">→<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-for list=\"{{ outCur }}\" as=\"o\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:18px;background:#f3f3f3\">\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#8a8a8a\">{{ o.id }}<\u002Fspan>\n                    <span style=\"flex:1 1 240px;font-size:15px;font-weight:700;line-height:1.35\">{{ o.title }}<\u002Fspan>\n                    <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:{{ o.tagBg }};color:{{ o.tagColor }}\">{{ o.tag }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <p style=\"margin:0;font-size:13px;line-height:1.55;text-wrap:pretty\">{{ o.change }}<\u002Fp>\n                  <div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#fff\">\n                    <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Готово, когда · {{ o.critCount }}<\u002Fspan>\n                    <sc-for list=\"{{ o.criteria }}\" as=\"k\" hint-placeholder-count=\"2\">\n                      <div style=\"display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.45\"><span style=\"width:14px;height:14px;margin-top:3px;border-radius:4px;box-shadow:inset 0 0 0 1.5px #bdbdbd\"><\u002Fspan><span>{{ k }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ o.hasAdrs }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <sc-for list=\"{{ o.adrs }}\" as=\"x\" hint-placeholder-count=\"2\">\n                        <div style=\"display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;font-size:12px;line-height:1.45\">\n                          <span style=\"font-family:'JetBrains Mono',monospace;font-weight:600\">{{ x.id }}<\u002Fspan><span style=\"color:#555\">{{ x.note }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                    <span style=\"flex:1;font-size:11px;color:#8a8a8a\">{{ o.meta }}<\u002Fspan>\n                    <button sc-camel-on-click=\"{{ o.approve }}\" style=\"padding:8px 16px;border:0;border-radius:999px;background:{{ o.approveBg }};color:#fff;font-size:12px;font-weight:600;cursor:pointer\">{{ o.approveLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n\n            <!-- notes -->\n            <sc-if value=\"{{ is.notes }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#555\">{{ notesCatalog }}<\u002Fspan>\n              <sc-for list=\"{{ statusChanges }}\" as=\"x\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:16px;background:#fbeceb\">\n                  <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b8352d\">Статус решения проекта меняется<\u002Fspan>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px\">\n                    <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700\">{{ x.adr }}<\u002Fspan>\n                    <span style=\"font-size:13px;text-decoration:line-through;text-decoration-color:rgba(184,53,45,.5)\">{{ x.title }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px\">\n                    <span style=\"padding:2px 9px;border-radius:999px;background:#e3f3e9;color:#1f7a45;font-weight:700\">{{ x.from }}<\u002Fspan>\n                    <span style=\"color:#8a8a8a\">→<\u002Fspan>\n                    <span style=\"padding:2px 9px;border-radius:999px;background:#fff;color:#b8352d;font-weight:700\">{{ x.to }}<\u002Fspan>\n                    <span style=\"color:#555\">заменено <span style=\"font-family:'JetBrains Mono',monospace;font-weight:700;color:#1d1d1d\">{{ x.by }}<\u002Fspan><\u002Fspan>\n                  <\u002Fdiv>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a3b35\">цепочка: {{ x.via }}<\u002Fspan>\n                  <span style=\"font-size:12px;line-height:1.5;color:#5a2b27\">{{ x.note }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ noteGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <div sc-camel-on-click=\"{{ g.toggle }}\" style=\"display:flex;align-items:baseline;gap:8px;padding:4px 2px;cursor:pointer\">\n                    <span style=\"font-size:13px;font-weight:700\">{{ g.label }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#8a8a8a\">{{ g.count }}<\u002Fspan>\n                    <span style=\"margin-left:auto;font-size:12px;color:#6a6a6a\">{{ g.toggleLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ true }}\">\n                    <sc-for list=\"{{ g.items }}\" as=\"n\" hint-placeholder-count=\"3\">\n                      <div style=\"display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;border-radius:14px;background:#f3f3f3\">\n                        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ n.id }}<\u002Fspan>\n                        <span style=\"font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ n.title }}<\u002Fspan>\n                        <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:{{ n.tagBg }};color:{{ n.tagColor }}\">{{ n.tag }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ is.idle }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:22px;border:1px dashed #c9c9c9;border-radius:18px;font-size:13px;color:#7a7a7a\">Шаг откроется, когда пройдены предыдущие.<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ stepFooter.show }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:14px;border-top:1px solid #e0e0e0\">\n                <span style=\"font-size:12px;color:#7a7a7a\">{{ stepFooter.note }}<\u002Fspan>\n                <sc-if value=\"{{ stepFooter.skip }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ advance }}\" style=\"margin-left:auto;padding:9px 14px;border:0;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer\">{{ stepFooter.skipLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n                <button sc-camel-on-click=\"{{ advance }}\" style=\"margin-left:{{ stepFooter.ml }};padding:10px 20px;border:0;border-radius:999px;background:#1d1d1d;color:#fff;font-size:13px;font-weight:600;cursor:pointer\">{{ stepFooter.label }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- TASKS -->\n    <sc-if value=\"{{ stageTasks }}\" hint-placeholder-val=\"{{ false }}\">\n      <sc-if value=\"{{ tasksPending }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;background:#fbf0d2\">\n        <span style=\"font-size:13px;font-weight:700;color:#7d5a00\">Не все потоки готовы<\u002Fspan>\n        <span style=\"flex:1;font-size:13px;color:#7d5a00\">{{ tasksNote }}<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:24px;background:#fbfbfb;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04)\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Задачи<\u002Fspan>\n          <h2 style=\"margin:0;font-size:20px;font-weight:800;letter-spacing:-0.01em\">Задачи для coding agents<\u002Fh2>\n          <p style=\"margin:0;max-width:720px;font-size:13px;line-height:1.5;color:#6a6a6a;text-wrap:pretty\">Итоги всех потоков нарезаны на задачи: зачем, где менять, что сделать, когда готово. Задачи из разных потоков связаны зависимостями.<\u002Fp>\n        <\u002Fdiv>\n        <sc-for list=\"{{ issues }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;padding:16px 18px;border-radius:18px;background:#f3f3f3\">\n            <div sc-camel-on-click=\"{{ o.toggle }}\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px;cursor:pointer\">\n              <span style=\"padding:3px 9px;border-radius:8px;background:#1d1d1d;color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px\">{{ o.id }}<\u002Fspan>\n              <span style=\"font-size:11px;font-weight:600;color:#8a8a8a\">поток {{ o.stream }}<\u002Fspan>\n              <span style=\"flex:1 1 260px;font-size:15px;font-weight:700;line-height:1.35\">{{ o.title }}<\u002Fspan>\n              <span style=\"padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:{{ o.tagBg }};color:{{ o.tagColor }}\">{{ o.tag }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#6a6a6a\">{{ o.toggleLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:13px;line-height:1.55;color:#3a3a3a;text-wrap:pretty\">{{ o.story }}<\u002Fp>\n            <sc-if value=\"{{ o.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Где менять<\u002Fspan>\n                <sc-for list=\"{{ o.entries }}\" as=\"e\" hint-placeholder-count=\"2\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.45;color:#3a3a3a;overflow-wrap:anywhere\">{{ e }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ o.hasCurrent }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Сейчас<\u002Fspan>\n                  <p style=\"margin:0;font-size:13px;line-height:1.55;color:#3a3a3a;text-wrap:pretty\">{{ o.current }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Сделать<\u002Fspan>\n                <sc-for list=\"{{ o.scopeList }}\" as=\"k\" hint-placeholder-count=\"2\">\n                  <div style=\"display:grid;grid-template-columns:12px minmax(0,1fr);gap:8px;font-size:13px;line-height:1.5\"><span style=\"width:5px;height:5px;margin-top:8px;border-radius:50%;background:#1d1d1d\"><\u002Fspan><span style=\"text-wrap:pretty\">{{ k }}<\u002Fspan><\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <sc-if value=\"{{ o.hasOpenQs }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:14px;background:#fbf0d2\">\n                  <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7d5a00\">Открытые вопросы для агента<\u002Fspan>\n                  <sc-for list=\"{{ o.openQs }}\" as=\"k\" hint-placeholder-count=\"1\">\n                    <span style=\"font-size:13px;line-height:1.45;color:#5a4300\">{{ k }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n            <span style=\"font-size:11px;color:#8a8a8a\">{{ o.meta }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasVanished }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,0.55)\">\n          <span style=\"font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a\">Уйдут из каталога · {{ vanishedCount }}<\u002Fspan>\n          <p style=\"margin:0;font-size:12px;color:#6a6a6a\">Задачи прошлой выгрузки, которых нет в нынешнем плане: при записи их файлы удалятся.<\u002Fp>\n          <sc-for list=\"{{ vanished }}\" as=\"v\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;font-size:13px;color:#6a6a6a\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">{{ v.id }}<\u002Fspan><span style=\"text-decoration:line-through\">{{ v.title }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:18px 20px;border-radius:18px;background:#1f1f1f;color:#fff\">\n        <div style=\"flex:1 1 240px;display:flex;flex-direction:column;gap:3px\">\n          <span style=\"font-size:15px;font-weight:700\">Записать задачи<\u002Fspan>\n          <span style=\"font-size:12px;color:#a8a8a8\">{{ tasksSummary }}<\u002Fspan>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ writeTasks }}\" style=\"padding:10px 20px;border:0;border-radius:999px;background:#fff;color:#1d1d1d;font-size:13px;font-weight:600;cursor:pointer\">Записать в каталог<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n<\u002Fmain>\n<\u002Fdiv>\n\n<!-- Project modal -->\n<sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(30,30,30,0.35);backdrop-filter:blur(6px);z-index:10\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"display:flex;flex-direction:column;gap:16px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:26px 28px 28px;border-radius:28px;background:#fbfbfb;box-shadow:0 30px 80px rgba(0,0,0,.25)\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <h2 style=\"flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-0.01em\">{{ modalTitle }}<\u002Fh2>\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"width:34px;height:34px;border:0;border-radius:50%;background:#efefef;font-size:18px;cursor:pointer\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:600;color:#555\">Название<\u002Fspan>\n        <input value=\"{{ draft.name }}\" sc-camel-on-change=\"{{ setDraftName }}\" placeholder=\"Например, Кромка\" style=\"padding:10px 14px;border:0;border-radius:14px;background:#f1f1f1;font-size:14px;color:#1d1d1d\">\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:600;color:#555\">Репозитории<\u002Fspan>\n        <span style=\"font-size:12px;color:#7a7a7a\">Рабочие копии git из COUNCIL_REPOS — отметьте нужные. Не больше 10.<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px\">\n          <sc-for list=\"{{ draftRepos }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <label style=\"display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:#f1f1f1;cursor:pointer\">\n              <input type=\"checkbox\" checked=\"{{ r.on }}\" sc-camel-on-change=\"{{ r.toggle }}\" style=\"width:16px;height:16px;accent-color:#1d1d1d\">\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:13px\">{{ r.name }}<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:12px;font-weight:600;color:#555\">Папка документации<\u002Fspan>\n        <input value=\"{{ draft.docs }}\" sc-camel-on-change=\"{{ setDraftDocs }}\" placeholder=\"путь от COUNCIL_REPOS, например project/docs/reasoning\" style=\"padding:8px 12px;border:0;border-radius:14px;background:#f1f1f1;font-family:'JetBrains Mono',monospace;font-size:13px;color:#1d1d1d\">\n        <span style=\"font-size:12px;line-height:1.45;color:#7a7a7a\">Сюда этап «Задачи» выгружает заметки, отсюда «Решения проекта» берут прошлые решения. Пусто — без папки.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:flex-end;gap:8px\">\n        <button sc-camel-on-click=\"{{ closeModal }}\" style=\"padding:10px 16px;border:0;background:transparent;color:#555;font-size:13px;font-weight:600;cursor:pointer\">Отмена<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ saveProject }}\" style=\"padding:10px 20px;border:0;border-radius:999px;background:#1d1d1d;color:#fff;font-size:13px;font-weight:600;cursor:pointer\">{{ modalSave }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;homeVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;kanban&quot;,&quot;list&quot;],&quot;default&quot;:&quot;kanban&quot;,&quot;tsType&quot;:&quot;'kanban'|'list'&quot;,&quot;section&quot;:&quot;Главная&quot;},&quot;sidebarCouncils&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Навигация&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;council&quot;,&quot;projects&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'council'|'projects'&quot;,&quot;section&quot;:&quot;Навигация&quot;},&quot;showProgress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Потоки&quot;},&quot;runStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grouped&quot;,&quot;grid&quot;,&quot;summary&quot;],&quot;default&quot;:&quot;grouped&quot;,&quot;tsType&quot;:&quot;'grouped'|'grid'|'summary'&quot;,&quot;section&quot;:&quot;Потоки&quot;}}\">\nconst LC = { done:'#2f9e5b', running:'#2f9e5b', yours:'#e0a100', failed:'#d1382f', idle:'#bdbdbd' };\nconst LT = { done:'готово', running:'ИИ работает', yours:'ждёт вас', failed:'ошибка', idle:'черновик' };\nconst TG = { green:['#e3f3e9','#1f7a45'], yellow:['#fbf0d2','#7d5a00'], red:['#fbeceb','#b8352d'], gray:['#ececec','#555'], dark:['#1d1d1d','#fff'] };\nconst tagOf = l => TG[{done:'green',running:'green',yours:'yellow',failed:'red',idle:'gray'}[l]];\nconst STAGES = [['brief','Ввод'],['slices','Нарезка'],['structure','Группы'],['research','Исследование'],['streams','Потоки'],['tasks','Задачи']];\nconst LABELS = [['idea','идея'],['question','вопрос'],['proposal','предложение'],['constraint','ограничение'],['risk','риск']];\nconst LBL = Object.fromEntries(LABELS);\n\nconst BRIEF = `Мастера на объектах часто без связи — подвал, промзона. Сейчас заявка не сохраняется, если пропала сеть, и человек заполняет всё заново.\n\nХочется, чтобы заявка копилась на телефоне и уходила сама, когда сеть вернётся. Непонятно, что делать, если диспетчер успел поменять ту же заявку на сервере.\n\nФото — главная боль: они тяжёлые, а по мобильному интернету грузятся минутами. Может, сжимать на устройстве?\n\nНужен понятный индикатор: есть сеть или нет, сколько заявок ждёт отправки. Ограничение: приложение уже на Android 8+, iOS не трогаем.`;\n\nconst FRAGS = [\n  { id:'F1', text:'Мастера на объектах часто без связи — подвал, промзона.', label:'constraint' },\n  { id:'F2', text:'Заявка не сохраняется, если пропала сеть, и человек заполняет всё заново.', label:'risk' },\n  { id:'F3', text:'Заявка копится на телефоне и уходит сама, когда сеть вернётся.', label:'idea' },\n  { id:'F4', text:'Что делать, если диспетчер успел поменять ту же заявку на сервере?', label:'question', note:'модели разошлись (2:1), решил судья: это вопрос, а не риск' },\n  { id:'F5', text:'Фото тяжёлые, а по мобильному интернету грузятся минутами.', label:'risk' },\n  { id:'F6', text:'Может, сжимать фото на устройстве?', label:'proposal' },\n  { id:'F7', text:'Понятный индикатор: есть сеть или нет, сколько заявок ждёт отправки.', label:'idea' },\n  { id:'F8', text:'Приложение уже на Android 8+, iOS не трогаем.', label:'constraint' },\n];\nconst GROUPS = [\n  { id:'A', title:'Офлайн-очередь заявок', ideaSrc:'из текста', idea:'Заявка копится на телефоне и уходит сама, когда сеть вернётся.', frags:['F1','F2','F3','F8'], link:'от неё зависит B' },\n  { id:'B', title:'Конфликты при синхронизации', ideaSrc:'ИИ', idea:'При отправке очереди сервер сверяет версии заявки и не затирает правки диспетчера молча.', frags:['F4','F5','F6'], link:'зависит от A · F5 — копия, общий с C' },\n  { id:'C', title:'Индикатор сети', ideaSrc:'из текста', idea:'Понятный индикатор: есть сеть или нет, сколько заявок ждёт отправки.', frags:['F7','F1'], link:'связана с A' },\n];\nconst STEPS = [\n  { key:'project', title:'Решения проекта', caps:'Решения проекта', hint:'Прошлые решения из заметок проекта, которые совет счёл относящимися к идее. Отмеченные учтут вопросы, варианты и решения: решённое не переспросят, а противоречие покажут.', next:'Учитывать отмеченные → к вопросам', skip:'Без прошлых решений → к вопросам' },\n  { key:'questions', title:'Вопросы', caps:'Вопросы', hint:'Оставьте вопросы, которые нужно решить, уберите лишние и добавьте свои. Совет учитывает карту кода и макета из исследования.', next:'Утвердить вопросы → к вариантам' },\n  { key:'options', title:'Варианты', caps:'Варианты', hint:'Выберите вариант на каждый вопрос или передайте вопрос как unresolved — его разберёт следующий шаг.', next:'Утвердить выбор → к решениям' },\n  { key:'decisions', title:'Решения', caps:'Решения', hint:'У каждого решения — вариант и почему он. Открытый вопрос заблокирует свои итоги.', next:'Зафиксировать решения → к итогам' },\n  { key:'outcomes', title:'Итоги', caps:'Итоги', hint:'Решения собраны в законченные изменения системы. Если решения не хватает, итог заблокирован, а не додуман. Утверждённые итоги уходят в задачи.', next:'Утвердить итоги → к документации' },\n  { key:'notes', title:'Документация', caps:'Документация', hint:'Совет выгружает поток в заметки проекта: идею, вопросы, варианты, решения (ADR) и итоги — файлом на заметку.
